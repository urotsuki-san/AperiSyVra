[workspace]
members = [
    "crates/aperisyvra-core",
    "crates/aperisyvra-cli",
    "crates/aperisyvra-analysis",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT"
authors = ["AperiSyVra Contributors"]
repository = "https://github.com/urotsuki-san/AperiSyVra"
rust-version = "1.81"

[workspace.dependencies]
anyhow = "=1.0.89"
clap = { version = "=4.5.20", features = ["derive"] }
rand = "=0.8.5"
sha3 = "=0.10.8"
thiserror = "=1.0.64"
zeroize = { version = "=1.8.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
